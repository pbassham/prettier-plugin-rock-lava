name: Publish Package to npmjs
on:
  push:
    branches:
      - main
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Check if version changed
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          LOCAL=$(node -p "require('./package.json').version")
          # The version currently published on npm (empty if never published)
          REMOTE=$(npm view "$NAME" version 2>/dev/null || echo "")
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "remote=$REMOTE" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version $LOCAL already published. Skipping."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Local version $LOCAL differs from npm ($REMOTE). Will publish."
          fi

      - name: Setup Bun
        if: steps.version.outputs.changed == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install the packages
        if: steps.version.outputs.changed == 'true'
        run: bun install --frozen-lockfile

      - name: Build the code
        if: steps.version.outputs.changed == 'true'
        run: bun run build
        env:
          NODE_ENV: production

      - name: Update npm (Trusted Publishing requires npm >= 11.5.1)
        if: steps.version.outputs.changed == 'true'
        run: npm install -g npm@latest

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        run: npm publish
