# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions
name: CI

on:
  push:
    # Don't run CI for tag pushes (releases) — the branch push already covers it
    tags-ignore:
      - "**"

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        node-version: [20, 22]
        prettier-major: [2, 3]

    name: OS ${{ matrix.os }} / NodeJS ${{ matrix.node-version }} / Prettier ${{ matrix.prettier-major }}

    env:
      PRETTIER_MAJOR: ${{ matrix.prettier-major }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install the packages
        run: bun install --frozen-lockfile

      - name: Build the code
        run: bun run build
        env:
          NODE_ENV: production

      - name: Check formatting
        run: bun run format:check

      - name: Run the unit tests
        run: bun run test

      - name: Run the idempotence tests
        run: bun run test:idempotence
